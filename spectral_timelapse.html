<meta charset="utf-8">
<title>T CrB Spectral Timelapse</title>
<style>
.viz-root {
  color-scheme: light;
  --surface-1:      #fcfcfb;
  --page:           #f9f9f7;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --grid:           #e1e0d9;
  --baseline:       #c3c2b7;
  --series-1:       #2a78d6;   /* current spectrum */
  --series-ref:     #c3c2b7;   /* mean reference spectrum */
  --line-marker:    #eb6834;   /* Hbeta/HeI-NaD/Halpha reference lines */
  --accent:         #1baf7a;   /* timeline current-position marker */
  --border:         rgba(11,11,11,0.10);
  --danger:         #d03b3b;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page:           #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --grid:           #2c2c2a;
    --baseline:       #383835;
    --series-1:       #3987e5;
    --series-ref:     #52514e;
    --line-marker:    #d95926;
    --accent:         #199e70;
    --border:         rgba(255,255,255,0.10);
    --danger:         #e66767;
  }
}
:root[data-theme="dark"] .viz-root {
  color-scheme: dark;
  --surface-1:      #1a1a19;
  --page:           #0d0d0d;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #898781;
  --grid:           #2c2c2a;
  --baseline:       #383835;
  --series-1:       #3987e5;
  --series-ref:     #52514e;
  --line-marker:    #d95926;
  --accent:         #199e70;
  --border:         rgba(255,255,255,0.10);
  --danger:         #e66767;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--page); }
.viz-root { background: var(--page); padding: 24px 16px 40px; }
.card {
  max-width: 1080px;
  margin: 0 auto;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px 24px 16px;
}
h1 { font-size: 19px; font-weight: 600; color: var(--text-primary); margin: 0 0 4px; }
.sub { font-size: 13px; color: var(--text-secondary); margin: 0 0 2px; }
.sub b { color: var(--text-primary); font-weight: 600; }
.caption { font-size: 12px; color: var(--text-muted); margin: 4px 0 14px; }

.legend { display: flex; gap: 20px; margin: 2px 0 14px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-secondary); }
.legend-swatch { width: 18px; height: 0; border-top-width: 2.5px; border-top-style: solid; }

.chart-wrap { position: relative; min-height: 120px; }
svg { width: 100%; height: auto; display: block; overflow: visible; }
.gridline { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.axis-line { stroke: var(--baseline); stroke-width: 1; shape-rendering: crispEdges; }
.tick-label { fill: var(--text-muted); font-size: 11px; }
.axis-title { fill: var(--text-secondary); font-size: 12px; font-weight: 500; }
.line-ref { stroke: var(--line-marker); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.55; }
.line-label { fill: var(--line-marker); font-size: 10.5px; font-weight: 600; }

.spec-ref { stroke: var(--series-ref); stroke-width: 1.5; fill: none; opacity: 0.9; }
.spec-cur { stroke: var(--series-1); stroke-width: 1.75; fill: none; }

.readout { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 14px 0; }
.readout-item { background: var(--page); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.readout-label { font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 3px; }
.readout-value { font-size: 16px; font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; }
.readout-value.small { font-size: 13px; }

.controls-row { display: flex; align-items: center; gap: 12px; margin: 6px 0 4px; }
.play-btn {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
  background: var(--series-1); color: white; font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.play-btn:hover { opacity: 0.9; }
.step-btn {
  width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border);
  background: transparent; color: var(--text-secondary); font-size: 13px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.step-btn:hover { color: var(--text-primary); border-color: var(--baseline); }
input[type=range] { flex: 1; accent-color: var(--series-1); }
.speed-select {
  font-family: inherit; font-size: 12px; color: var(--text-secondary);
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px;
  padding: 5px 8px;
}

.timeline-wrap { position: relative; margin: 14px 0 6px; }
.timeline-svg { width: 100%; height: 44px; display: block; }
.timeline-baseline { stroke: var(--baseline); stroke-width: 1; }
.timeline-tick { fill: var(--baseline); }
.timeline-tick.current { fill: var(--accent); }
.timeline-gap-label { fill: var(--text-muted); font-size: 9.5px; }

.tooltip {
  position: absolute; pointer-events: none;
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12px;
  color: var(--text-secondary); box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  opacity: 0; transition: opacity 80ms ease; white-space: nowrap; z-index: 5;
}
.tooltip.show { opacity: 1; }

.controls { display: flex; justify-content: flex-end; margin: 14px 0 12px; }
.toggle-btn {
  font-family: inherit; font-size: 12px; font-weight: 500;
  color: var(--text-secondary); background: transparent;
  border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 12px; cursor: pointer;
}
.toggle-btn:hover { color: var(--text-primary); border-color: var(--baseline); }

table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 6px; display: none; max-height: 400px; }
table.show { display: table; }
th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; color: var(--text-secondary); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--text-muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.02em; position: sticky; top: 0; background: var(--surface-1); }
td.val { color: var(--text-primary); font-weight: 500; }
tr.active-row { background: var(--page); }
tr.active-row td { color: var(--text-primary); font-weight: 600; }
tr { cursor: pointer; }

.state-msg { font-size: 13px; color: var(--text-muted); padding: 40px 0; text-align: center; }
.state-msg.error { color: var(--danger); }
.state-msg code { background: var(--grid); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>

<div class="viz-root">
  <div class="card">
    <h1>T CrB — Spectral Timelapse</h1>
    <p class="sub" id="subLine">Continuum-normalized optical spectra &middot; loading…</p>
    <p class="caption" id="captionLine"></p>

    <div class="legend">
      <div class="legend-item"><span class="legend-swatch" style="border-color:var(--series-1)"></span>Current epoch</div>
      <div class="legend-item"><span class="legend-swatch" style="border-color:var(--series-ref)"></span>Mean of all 139 spectra</div>
      <div class="legend-item"><span class="legend-swatch" style="border-color:var(--line-marker); border-top-style:dashed"></span>Hβ / He I+Na D / Hα</div>
    </div>

    <div class="chart-wrap" id="chartWrap">
      <p class="state-msg" id="stateMsg">Loading spectra_data.json…</p>
      <svg id="chart" viewBox="0 0 1000 420" preserveAspectRatio="xMidYMid meet" style="display:none"></svg>
      <div class="tooltip" id="tooltip"></div>
    </div>

    <div class="readout" id="readout" style="display:none">
      <div class="readout-item"><div class="readout-label">Date</div><div class="readout-value" id="rDate">—</div></div>
      <div class="readout-item"><div class="readout-label">Orbital phase</div><div class="readout-value" id="rPhase">—</div></div>
      <div class="readout-item"><div class="readout-label">H-alpha peak</div><div class="readout-value" id="rHaPeak">—</div></div>
      <div class="readout-item"><div class="readout-label">H-alpha EW</div><div class="readout-value" id="rHaEW">—</div></div>
      <div class="readout-item"><div class="readout-label">Nearest V mag</div><div class="readout-value" id="rVmag">—</div></div>
    </div>

    <div class="controls-row" id="controlsRow" style="display:none">
      <button class="play-btn" id="playBtn" aria-label="Play">▶</button>
      <button class="step-btn" id="prevBtn" aria-label="Previous epoch">‹</button>
      <input type="range" id="slider" min="0" max="0" value="0" step="1">
      <button class="step-btn" id="nextBtn" aria-label="Next epoch">›</button>
      <select class="speed-select" id="speedSelect">
        <option value="400">Slow</option>
        <option value="180" selected>Normal</option>
        <option value="70">Fast</option>
      </select>
    </div>

    <div class="timeline-wrap" id="timelineWrap" style="display:none">
      <svg class="timeline-svg" id="timelineSvg"></svg>
    </div>

    <div class="controls">
      <button class="toggle-btn" id="tableToggle" style="display:none">Show all epochs</button>
    </div>

    <table id="dataTable">
      <thead>
        <tr><th>Date</th><th>Phase</th><th>Hα peak</th><th>Hα EW</th><th>Continuum color</th><th>V mag</th></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script src="spectra_data.js"></script>
<script>
const DATA_FILE = './spectra_data.js';
let EPOCHS = [], IDX = 0, PLAYING = false, TIMER = null;

function main() {
  const stateMsg = document.getElementById('stateMsg');
  if (typeof SPECTRA_DATA === 'undefined') {
    stateMsg.classList.add('error');
    stateMsg.innerHTML = `Couldn't load <code>${DATA_FILE}</code>.<br>` +
      `Make sure this file sits alongside spectra_data.js (same directory as this HTML page) ` +
      `and that you've run <code>spec_pipeline.py</code> at least once.`;
    return;
  }
  init(SPECTRA_DATA);
}

function init(data) {
  EPOCHS = data.epochs;
  const grid = data.wavelength_grid;
  window.WL = Array.from({length: grid.n}, (_, i) => grid.start + i * grid.step);
  window.LINES = data.lines;

  document.getElementById('subLine').innerHTML =
    `Continuum-normalized optical spectra, <b>${EPOCHS.length}</b> epochs &middot; ` +
    `${EPOCHS[0].date} to ${EPOCHS[EPOCHS.length-1].date} &middot; observer CDZ`;
  document.getElementById('captionLine').textContent =
    `Flux normalized by a 151 Å running-median continuum. Gray = mean of all epochs (reference); ` +
    `blue = the currently selected spectrum. Hα (6563 Å) is by far the most variable feature in this ` +
    `range — 5× the std. dev. of any other wavelength.`;

  document.getElementById('stateMsg').style.display = 'none';
  document.getElementById('chart').style.display = '';
  document.getElementById('readout').style.display = '';
  document.getElementById('controlsRow').style.display = '';
  document.getElementById('timelineWrap').style.display = '';
  document.getElementById('tableToggle').style.display = '';
  document.getElementById('tableToggle').textContent = `Show all ${EPOCHS.length} epochs`;

  buildChart();
  buildTimeline();
  buildTable();

  const slider = document.getElementById('slider');
  slider.max = EPOCHS.length - 1;
  slider.addEventListener('input', () => { setIndex(+slider.value); });

  document.getElementById('prevBtn').addEventListener('click', () => setIndex(Math.max(0, IDX-1)));
  document.getElementById('nextBtn').addEventListener('click', () => setIndex(Math.min(EPOCHS.length-1, IDX+1)));
  document.getElementById('playBtn').addEventListener('click', togglePlay);
  document.getElementById('speedSelect').addEventListener('change', () => { if (PLAYING) { stopPlay(); startPlay(); } });

  setIndex(0);
}

let svgRefs = {};

function buildChart() {
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById('chart');
  const W = 1000, H = 420;
  const M = { top: 16, right: 20, bottom: 40, left: 46 };
  const plotW = W - M.left - M.right;
  const plotH = H - M.top - M.bottom;

  const wl = window.WL;
  const xMin = wl[0], xMax = wl[wl.length-1];
  // fixed y-range across ALL epochs so the animation doesn't jump-rescale
  let yMax = 0;
  EPOCHS.forEach(e => e.flux.forEach(v => { if (v!=null && v>yMax) yMax = v; }));
  yMax = Math.ceil(yMax/0.5)*0.5 + 0.3;
  const yMin = 0;

  function xScale(x) { return M.left + (x - xMin)/(xMax-xMin)*plotW; }
  function yScale(y) { return M.top + (yMax - y)/(yMax-yMin)*plotH; }

  function el(tag, attrs) {
    const e = document.createElementNS(svgNS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  for (let v = 0; v <= yMax; v += 1) {
    const y = yScale(v);
    svg.appendChild(el('line', { class:'gridline', x1:M.left, x2:M.left+plotW, y1:y, y2:y }));
    const lbl = el('text', { class:'tick-label', x:M.left-8, y:y+4, 'text-anchor':'end' });
    lbl.textContent = v;
    svg.appendChild(lbl);
  }
  for (let x = Math.ceil(xMin/500)*500; x <= xMax; x += 500) {
    const px = xScale(x);
    svg.appendChild(el('line', { class:'axis-line', x1:px, x2:px, y1:M.top+plotH, y2:M.top+plotH+5 }));
    const lbl = el('text', { class:'tick-label', x:px, y:M.top+plotH+18, 'text-anchor':'middle' });
    lbl.textContent = x;
    svg.appendChild(lbl);
  }
  svg.appendChild(el('line', { class:'axis-line', x1:M.left, x2:M.left+plotW, y1:M.top+plotH, y2:M.top+plotH }));
  svg.appendChild(el('line', { class:'axis-line', x1:M.left, x2:M.left, y1:M.top, y2:M.top+plotH }));
  const yTitle = el('text', { class:'axis-title', x:14, y:M.top+plotH/2, 'text-anchor':'middle',
    transform:`rotate(-90 14 ${M.top+plotH/2})` });
  yTitle.textContent = 'Normalized flux';
  svg.appendChild(yTitle);
  const xTitle = el('text', { class:'axis-title', x:M.left+plotW/2, y:H-4, 'text-anchor':'middle' });
  xTitle.textContent = 'Wavelength (Å)';
  svg.appendChild(xTitle);

  Object.entries(window.LINES).forEach(([name, center]) => {
    const x = xScale(center);
    svg.appendChild(el('line', { class:'line-ref', x1:x, x2:x, y1:M.top, y2:M.top+plotH }));
    const lbl = el('text', { class:'line-label', x:x, y:M.top+10, 'text-anchor':'middle' });
    lbl.textContent = name === 'Halpha' ? 'Hα' : name === 'Hbeta' ? 'Hβ' : 'HeI/NaD';
    svg.appendChild(lbl);
  });

  // reference: mean spectrum
  const n = wl.length;
  const meanFlux = new Array(n).fill(0);
  const counts = new Array(n).fill(0);
  EPOCHS.forEach(e => e.flux.forEach((v,i) => { if (v!=null) { meanFlux[i]+=v; counts[i]++; } }));
  for (let i=0;i<n;i++) meanFlux[i] = counts[i] ? meanFlux[i]/counts[i] : null;
  let refPath = '';
  meanFlux.forEach((v,i) => { if (v!=null) refPath += (refPath?'L':'M') + xScale(wl[i]).toFixed(2) + ' ' + yScale(v).toFixed(2) + ' '; });
  svg.appendChild(el('path', { class:'spec-ref', d: refPath }));

  const curPath = el('path', { class:'spec-cur', d:'' });
  svg.appendChild(curPath);

  svgRefs = { svg, xScale, yScale, curPath, wl };
}

function renderSpectrum(idx) {
  const { xScale, yScale, curPath, wl } = svgRefs;
  const flux = EPOCHS[idx].flux;
  let d = '';
  flux.forEach((v,i) => { if (v!=null) d += (d?'L':'M') + xScale(wl[i]).toFixed(2) + ' ' + yScale(v).toFixed(2) + ' '; });
  curPath.setAttribute('d', d);
}

function buildTimeline() {
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById('timelineSvg');
  const W = 1000, H = 44;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const M = { left: 10, right: 10 };
  const plotW = W - M.left - M.right;

  const jds = EPOCHS.map(e => e.jd);
  const jdMin = jds[0], jdMax = jds[jds.length-1];
  function xScale(jd) { return M.left + (jd-jdMin)/(jdMax-jdMin)*plotW; }

  function el(tag, attrs) {
    const e = document.createElementNS(svgNS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  svg.appendChild(el('line', { class:'timeline-baseline', x1:M.left, x2:M.left+plotW, y1:22, y2:22 }));

  EPOCHS.forEach((e,i) => {
    const x = xScale(e.jd);
    const c = el('circle', { class:'timeline-tick', cx:x, cy:22, r:2.2, 'data-idx':i, style:'cursor:pointer' });
    c.addEventListener('click', () => setIndex(i));
    svg.appendChild(c);
  });

  // label year ticks
  const years = new Set();
  EPOCHS.forEach(e => years.add(new Date(e.date).getUTCFullYear()));
  years.forEach(y => {
    const jd = Date.UTC(y,0,1)/86400000 + 2440587.5;
    if (jd < jdMin || jd > jdMax) return;
    const x = xScale(jd);
    const lbl = el('text', { x, y:38, 'text-anchor':'middle', class:'timeline-gap-label' });
    lbl.textContent = y;
    svg.appendChild(lbl);
  });

  svgRefs.timelineSvg = svg;
}

function updateTimelineMarker() {
  const svg = svgRefs.timelineSvg;
  svg.querySelectorAll('.timeline-tick').forEach((c,i) => {
    c.classList.toggle('current', i === IDX);
    c.setAttribute('r', i === IDX ? 4.5 : 2.2);
  });
}

function buildTable() {
  const tbody = document.getElementById('tableBody');
  EPOCHS.forEach((e,i) => {
    const tr = document.createElement('tr');
    tr.dataset.idx = i;
    tr.addEventListener('click', () => setIndex(i));
    const cells = [
      e.date,
      e.phase.toFixed(3),
      e.Halpha_peak != null ? e.Halpha_peak.toFixed(2) : '—',
      e.Halpha_ew != null ? e.Halpha_ew.toFixed(1) : '—',
      e.continuum_color != null ? e.continuum_color.toFixed(3) : '—',
      e.vmag_nearest != null ? (+e.vmag_nearest).toFixed(3) : '—',
    ];
    cells.forEach((c,ci) => {
      const td = document.createElement('td');
      if (ci===2) td.className='val';
      td.textContent = c;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  document.getElementById('tableToggle').addEventListener('click', (e) => {
    const t = document.getElementById('dataTable');
    t.classList.toggle('show');
    e.target.textContent = t.classList.contains('show') ? 'Hide epoch table' : `Show all ${EPOCHS.length} epochs`;
  });
}

function setIndex(i) {
  IDX = i;
  renderSpectrum(i);
  updateTimelineMarker();
  document.getElementById('slider').value = i;
  const e = EPOCHS[i];
  document.getElementById('rDate').textContent = e.date;
  document.getElementById('rPhase').textContent = e.phase.toFixed(3);
  document.getElementById('rHaPeak').textContent = e.Halpha_peak != null ? e.Halpha_peak.toFixed(2)+'×' : '—';
  document.getElementById('rHaEW').textContent = e.Halpha_ew != null ? e.Halpha_ew.toFixed(1)+' Å' : '—';
  document.getElementById('rVmag').textContent = e.vmag_nearest != null ? (+e.vmag_nearest).toFixed(2) : '—';

  document.querySelectorAll('#tableBody tr').forEach(tr => tr.classList.toggle('active-row', +tr.dataset.idx === i));
}

function togglePlay() { PLAYING ? stopPlay() : startPlay(); }
function startPlay() {
  PLAYING = true;
  document.getElementById('playBtn').textContent = '❚❚';
  const speed = +document.getElementById('speedSelect').value;
  TIMER = setInterval(() => {
    let next = IDX + 1;
    if (next >= EPOCHS.length) next = 0;
    setIndex(next);
  }, speed);
}
function stopPlay() {
  PLAYING = false;
  document.getElementById('playBtn').textContent = '▶';
  clearInterval(TIMER);
}

main();
</script>
