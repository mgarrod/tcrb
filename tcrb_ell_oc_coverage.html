<meta charset="utf-8">
<title>T CrB ELL O–C — Full Epoch Coverage</title>
<style>
.viz-root {
  color-scheme: light;
  --surface-1:      #fcfcfb;
  --page:           #f9f9f7;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --grid:           #e1e0d9;
  --baseline:       #c3c2b7;
  --series-1:       #2a78d6;
  --series-1-soft:  rgba(42,120,214,0.35);
  --missing:        #898781;
  --missing-soft:   rgba(137,135,129,0.18);
  --trend:          #eb6834;
  --border:         rgba(11,11,11,0.10);
  --danger:         #d03b3b;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page:           #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --grid:           #2c2c2a;
    --baseline:       #383835;
    --series-1:       #3987e5;
    --series-1-soft:  rgba(57,135,229,0.40);
    --missing:        #898781;
    --missing-soft:   rgba(137,135,129,0.22);
    --trend:          #d95926;
    --border:         rgba(255,255,255,0.10);
    --danger:         #e66767;
  }
}
:root[data-theme="dark"] .viz-root {
  color-scheme: dark;
  --surface-1:      #1a1a19;
  --page:           #0d0d0d;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #898781;
  --grid:           #2c2c2a;
  --baseline:       #383835;
  --series-1:       #3987e5;
  --series-1-soft:  rgba(57,135,229,0.40);
  --missing:        #898781;
  --missing-soft:   rgba(137,135,129,0.22);
  --trend:          #d95926;
  --border:         rgba(255,255,255,0.10);
  --danger:         #e66767;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--page); }
.viz-root { background: var(--page); padding: 24px 16px 40px; }
.card {
  max-width: 1040px;
  margin: 0 auto;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px 24px 16px;
}
h1 { font-size: 19px; font-weight: 600; color: var(--text-primary); margin: 0 0 4px; }
.sub { font-size: 13px; color: var(--text-secondary); margin: 0 0 2px; }
.sub b { color: var(--text-primary); font-weight: 600; }
.caption { font-size: 12px; color: var(--text-muted); margin: 4px 0 14px; }
.freshness { font-size: 11.5px; color: var(--text-muted); margin: 0 0 14px; }

.legend { display: flex; gap: 20px; margin: 2px 0 14px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-secondary); }
.legend-dot { width: 9px; height: 9px; border-radius: 50%; }
.legend-x { width: 10px; height: 10px; position: relative; }
.legend-x::before, .legend-x::after { content:''; position:absolute; top:50%; left:0; width:100%; height:2px; background:var(--missing); }
.legend-x::before { transform: rotate(45deg); }
.legend-x::after { transform: rotate(-45deg); }
.legend-swatch { width: 18px; height: 0; border-top-width: 2.5px; border-top-style: dashed; }

.chart-wrap { position: relative; min-height: 120px; }
svg { width: 100%; height: auto; display: block; overflow: visible; }
.gridline { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.axis-line { stroke: var(--baseline); stroke-width: 1; shape-rendering: crispEdges; }
.zero-line { stroke: var(--baseline); stroke-width: 1.5; }
.tick-label { fill: var(--text-muted); font-size: 11px; }
.axis-title { fill: var(--text-secondary); font-size: 12px; font-weight: 500; }
.zero-label { fill: var(--text-secondary); font-size: 11px; font-weight: 500; }

.errbar { stroke: var(--series-1-soft); stroke-width: 1.5; }
.point { fill: var(--series-1); stroke: var(--surface-1); stroke-width: 2; }
.miss-x { stroke: var(--missing); stroke-width: 2; stroke-linecap: round; }
.hit { fill: transparent; cursor: pointer; }

.trend-line { stroke: var(--trend); stroke-width: 2; stroke-dasharray: 5 4; fill: none; }
.trend-label { fill: var(--text-secondary); font-size: 11.5px; font-weight: 500; }

.tooltip {
  position: absolute; pointer-events: none;
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12px;
  color: var(--text-secondary); box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  opacity: 0; transition: opacity 80ms ease; white-space: nowrap; z-index: 5;
}
.tooltip.show { opacity: 1; }
.tooltip .row { display: flex; justify-content: space-between; gap: 14px; }
.tooltip .val { color: var(--text-primary); font-weight: 600; }
.tooltip .hd { color: var(--text-primary); font-weight: 600; margin-bottom: 4px; font-size: 12.5px; }
.tooltip .reason { color: var(--text-muted); font-size: 11px; margin-top: 4px; max-width: 220px; white-space: normal; }

.controls { display: flex; justify-content: flex-end; margin: 4px 0 12px; }
.toggle-btn {
  font-family: inherit; font-size: 12px; font-weight: 500;
  color: var(--text-secondary); background: transparent;
  border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 12px; cursor: pointer;
}
.toggle-btn:hover { color: var(--text-primary); border-color: var(--baseline); }

table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 6px; display: none; }
table.show { display: table; }
th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; color: var(--text-secondary); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--text-muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.02em; }
td.val { color: var(--text-primary); font-weight: 500; }
tr.missing-row td { color: var(--text-muted); font-style: italic; }

.state-msg { font-size: 13px; color: var(--text-muted); padding: 40px 0; text-align: center; }
.state-msg.error { color: var(--danger); }
.state-msg code { background: var(--grid); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>

<div class="viz-root">
  <div class="card">
    <h1>T CrB — ELL O&ndash;C, Full Epoch Coverage</h1>
    <p class="sub" id="subLine">Every predicted primary-minimum epoch &middot; loading ephemeris…</p>
    <p class="caption" id="captionLine">Hover any point or ✕ for detail.</p>
    <p class="freshness" id="freshnessLine"></p>

    <div class="legend">
      <div class="legend-item"><span class="legend-dot" style="background:var(--series-1)"></span>Fitted minimum</div>
      <div class="legend-item"><span class="legend-swatch" style="border-color:var(--trend)"></span>Weighted trend fit</div>
      <div class="legend-item"><span class="legend-x"></span>No reliable fit (coverage gap)</div>
    </div>

    <div class="chart-wrap" id="chartWrap">
      <p class="state-msg" id="stateMsg">Loading oc_data.json…</p>
      <svg id="chart" viewBox="0 0 1000 480" preserveAspectRatio="xMidYMid meet" style="display:none"></svg>
      <div class="tooltip" id="tooltip"></div>
    </div>

    <div class="controls">
      <button class="toggle-btn" id="tableToggle" style="display:none">Show all epochs</button>
    </div>

    <table id="dataTable">
      <thead>
        <tr><th>Epoch (E)</th><th>Year</th><th>O&ndash;C (days)</th><th>Nights in window</th><th>Detail</th></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script src="./oc_data.js"></script>
<script>
const DATA_FILE = './oc_data.js';

function reasonText(m) {
  const parts = [];
  if (m.n < 10) parts.push(`only ${m.n} night${m.n===1?'':'s'} in ±50d window (need ≥10)`);
  if (m.before < 3) parts.push(`only ${m.before} night${m.before===1?'':'s'} before predicted minimum`);
  if (m.after < 3) parts.push(`only ${m.after} night${m.after===1?'':'s'} after predicted minimum`);
  if (parts.length === 0) parts.push(m.status === 'pending' ? 'not enough post-minimum data yet' : 'insufficient coverage');
  return parts.join('; ');
}

function main() {
  const stateMsg = document.getElementById('stateMsg');
  if (typeof OC_DATA === 'undefined') {
    stateMsg.classList.add('error');
    stateMsg.innerHTML = `Couldn't load <code>${DATA_FILE}</code>.<br>` +
      `Make sure this file sits alongside oc_data.js (same directory as this HTML page) ` +
      `and that you've run <code>update_data.py</code> at least once.`;
    return;
  }
  render(OC_DATA);
}

function render(data) {
  const OK = data.results;
  const MISSING = data.missing;
  const FIT = data.params;

  const E_MIN = Math.min(...OK.map(d=>d.E), ...MISSING.map(d=>d.E));
  const E_MAX = Math.max(...OK.map(d=>d.E), ...MISSING.map(d=>d.E));
  const total = OK.length + MISSING.length;

  document.getElementById('subLine').innerHTML =
    `Every predicted primary-minimum epoch from <b>E${E_MIN} (${OK.find(d=>d.E===E_MIN)?.year?.toFixed(2) ?? MISSING.find(d=>d.E===E_MIN)?.year.toFixed(2)})</b> ` +
    `to the present &middot; P = ${FIT.P} d, T₀ = HJD ${FIT.T0}`;
  document.getElementById('captionLine').textContent =
    `${total} consecutive epochs. ${OK.length} have a reliable fit (blue, with 1σ error bars); ${MISSING.length} are marked with an ✕ ` +
    `where the AAVSO V-band window had too few nights, lopsided before/after coverage, or (most recent) hasn't fully happened yet. Hover any point or ✕ for detail.`;
  if (data.generated_at) {
    const gen = new Date(data.generated_at);
    document.getElementById('freshnessLine').textContent =
      `Data through ${data.data_through} · pipeline last run ${gen.toLocaleString()}`;
  }
  document.getElementById('tableToggle').textContent = `Show all ${total} epochs`;
  document.getElementById('tableToggle').style.display = '';
  document.getElementById('stateMsg').style.display = 'none';

  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById('chart');
  svg.style.display = '';
  const W = 1000, H = 480;
  const M = { top: 20, right: 28, bottom: 46, left: 56 };
  const plotW = W - M.left - M.right;
  const plotH = H - M.top - M.bottom;

  function xScale(E) { return M.left + (E - E_MIN) / (E_MAX - E_MIN) * plotW; }

  const ocVals = OK.flatMap(d => [d.OC_days - (d.OC_err_days||0), d.OC_days + (d.OC_err_days||0)]);
  let yMax = Math.max(...ocVals.map(Math.abs));
  yMax = Math.ceil(yMax / 2) * 2 + 2;
  const yMin = -yMax;
  function yScale(oc) { return M.top + (yMax - oc) / (yMax - yMin) * plotH; }

  function el(tag, attrs) {
    const e = document.createElementNS(svgNS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // gridlines
  const range = yMax - yMin;
  let step = 2;
  if (range > 20) step = 5;
  if (range > 40) step = 10;
  for (let v = Math.ceil(yMin/step)*step; v <= yMax; v += step) {
    if (v === 0) continue;
    const y = yScale(v);
    svg.appendChild(el('line', { class:'gridline', x1:M.left, x2:M.left+plotW, y1:y, y2:y }));
    const lbl = el('text', { class:'tick-label', x:M.left-8, y:y+4, 'text-anchor':'end' });
    lbl.textContent = v;
    svg.appendChild(lbl);
  }

  // zero line
  const y0 = yScale(0);
  svg.appendChild(el('line', { class:'zero-line', x1:M.left, x2:M.left+plotW, y1:y0, y2:y0 }));
  const zeroLbl = el('text', { class:'zero-label', x:M.left+plotW, y:y0-6, 'text-anchor':'end' });
  zeroLbl.textContent = 'O–C = 0';
  svg.appendChild(zeroLbl);

  // x axis: every epoch tick (integer), label every other to avoid crowding
  for (let E = E_MIN; E <= E_MAX; E++) {
    const x = xScale(E);
    svg.appendChild(el('line', { class:'axis-line', x1:x, x2:x, y1:M.top+plotH, y2:M.top+plotH+5 }));
    if ((E - E_MIN) % 2 === 0) {
      const lbl = el('text', { class:'tick-label', x:x, y:M.top+plotH+20, 'text-anchor':'middle' });
      lbl.textContent = E;
      svg.appendChild(lbl);
    }
  }
  svg.appendChild(el('line', { class:'axis-line', x1:M.left, x2:M.left+plotW, y1:M.top+plotH, y2:M.top+plotH }));

  const yTitle = el('text', { class:'axis-title', x:16, y:M.top+plotH/2, 'text-anchor':'middle',
    transform:`rotate(-90 16 ${M.top+plotH/2})` });
  yTitle.textContent = 'O–C (days)';
  svg.appendChild(yTitle);
  const xTitle = el('text', { class:'axis-title', x:M.left+plotW/2, y:H-6, 'text-anchor':'middle' });
  xTitle.textContent = 'Epoch (E)';
  svg.appendChild(xTitle);

  // trend line
  if (FIT.dP != null && FIT.dT0 != null) {
    const trendPts = [E_MIN, E_MAX].map(E => [xScale(E), yScale(FIT.dT0 + FIT.dP*E)]);
    svg.appendChild(el('line', { class:'trend-line', x1:trendPts[0][0], y1:trendPts[0][1], x2:trendPts[1][0], y2:trendPts[1][1] }));
    const trendLbl = el('text', { class:'trend-label', x:trendPts[1][0]-4, y:trendPts[1][1]-8, 'text-anchor':'end' });
    trendLbl.textContent = `ΔP = ${FIT.dP.toFixed(4)} d/cycle`;
    svg.appendChild(trendLbl);
  }

  const tooltip = document.getElementById('tooltip');
  const wrap = document.getElementById('chartWrap');

  function place(px, py) {
    const rect = wrap.getBoundingClientRect();
    const svgRect = svg.getBoundingClientRect();
    const scale = svgRect.width / W;
    return [svgRect.left - rect.left + px*scale, svgRect.top - rect.top + py*scale];
  }
  function tipRow(k, v) {
    const r = document.createElement('div'); r.className='row';
    const kk = document.createElement('span'); kk.textContent = k;
    const vv = document.createElement('span'); vv.className='val'; vv.textContent = v;
    r.appendChild(kk); r.appendChild(vv);
    return r;
  }

  // OK points
  OK.forEach(d => {
    const x = xScale(d.E);
    const err = d.OC_err_days || 0;
    const yTop = yScale(d.OC_days + err);
    const yBot = yScale(d.OC_days - err);
    const y = yScale(d.OC_days);

    svg.appendChild(el('line', { class:'errbar', x1:x, x2:x, y1:yTop, y2:yBot }));
    svg.appendChild(el('line', { class:'errbar', x1:x-4, x2:x+4, y1:yTop, y2:yTop }));
    svg.appendChild(el('line', { class:'errbar', x1:x-4, x2:x+4, y1:yBot, y2:yBot }));

    const pt = el('circle', { class:'point', cx:x, cy:y, r:5 });
    svg.appendChild(pt);

    const hit = el('circle', { class:'hit', cx:x, cy:y, r:14, tabindex:0 });
    const show = () => {
      pt.setAttribute('r', 6.5);
      const [px,py] = place(x,y);
      tooltip.innerHTML = '';
      const hd = document.createElement('div'); hd.className='hd'; hd.textContent = `Epoch ${d.E} · ${d.year.toFixed(2)}`;
      tooltip.appendChild(hd);
      tooltip.appendChild(tipRow('O–C', `${d.OC_days>=0?'+':''}${d.OC_days.toFixed(2)} ± ${err.toFixed(2)} d`));
      tooltip.appendChild(tipRow('Nights used', d.n_nights));
      tooltip.style.left = (px+14)+'px'; tooltip.style.top = (py-10)+'px';
      tooltip.classList.add('show');
    };
    const hide = () => { pt.setAttribute('r', 5); tooltip.classList.remove('show'); };
    hit.addEventListener('pointerenter', show); hit.addEventListener('pointermove', show);
    hit.addEventListener('focus', show); hit.addEventListener('pointerleave', hide); hit.addEventListener('blur', hide);
    svg.appendChild(hit);
  });

  // missing epochs as X marks on the zero line
  MISSING.forEach(m => {
    const x = xScale(m.E);
    const y = y0;
    const s = 6;
    const l1 = el('line', { class:'miss-x', x1:x-s, y1:y-s, x2:x+s, y2:y+s });
    const l2 = el('line', { class:'miss-x', x1:x-s, y1:y+s, x2:x+s, y2:y-s });
    svg.appendChild(l1); svg.appendChild(l2);

    const hit = el('circle', { class:'hit', cx:x, cy:y, r:14, tabindex:0 });
    const show = () => {
      const [px,py] = place(x,y);
      tooltip.innerHTML = '';
      const hd = document.createElement('div'); hd.className='hd'; hd.textContent = `Epoch ${m.E} · ${m.year.toFixed(2)}`;
      tooltip.appendChild(hd);
      tooltip.appendChild(tipRow('Nights in window', m.n));
      tooltip.appendChild(tipRow('Before / after split', `${m.before} / ${m.after}`));
      const reason = document.createElement('div'); reason.className = 'reason';
      reason.textContent = (m.status === 'pending' ? 'Not confirmed yet: ' : 'No fit: ') + reasonText(m);
      tooltip.appendChild(reason);
      tooltip.style.left = (px+14)+'px'; tooltip.style.top = (py-10)+'px';
      tooltip.classList.add('show');
    };
    const hide = () => tooltip.classList.remove('show');
    hit.addEventListener('pointerenter', show); hit.addEventListener('pointermove', show);
    hit.addEventListener('focus', show); hit.addEventListener('pointerleave', hide); hit.addEventListener('blur', hide);
    svg.appendChild(hit);
  });

  // table: merge OK + MISSING, sorted by epoch
  const rows = [
    ...OK.map(d => ({...d, ok:true})),
    ...MISSING.map(m => ({...m, ok:false}))
  ].sort((a,b) => a.E - b.E);

  const tbody = document.getElementById('tableBody');
  rows.forEach(r => {
    const tr = document.createElement('tr');
    if (!r.ok) tr.className = 'missing-row';
    const cells = r.ok
      ? [r.E, r.year.toFixed(3), (r.OC_days>=0?'+':'')+r.OC_days.toFixed(2)+' ± '+(r.OC_err_days||0).toFixed(2), r.n_nights, '']
      : [r.E, r.year.toFixed(3), '—', r.n, reasonText(r)];
    cells.forEach((c,i) => {
      const td = document.createElement('td');
      if (i===2 && r.ok) td.className='val';
      td.textContent = c;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  document.getElementById('tableToggle').addEventListener('click', (e) => {
    const t = document.getElementById('dataTable');
    t.classList.toggle('show');
    e.target.textContent = t.classList.contains('show') ? 'Hide epoch table' : `Show all ${total} epochs`;
  });
}

main();
</script>
